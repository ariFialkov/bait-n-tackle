<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a6e8e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bait N' Tackle</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Menu overlay -->
  <div id="menu">
    <div class="menu-title">
      <h1>Bait <span>N’</span> Tackle</h1>
      <p class="tagline">Trawl the shallows. Cast for trophies.</p>
    </div>
    <div class="menu-actions">
      <button id="play-btn">⛵ &nbsp;Set Sail</button>
      <button id="dex-btn">📖 &nbsp;Fishopedia</button>
      <p class="menu-tips">Drive to coves &amp; rough water — that’s where the fish bite fastest.</p>
    </div>
  </div>

  <!-- Fishopedia -->
  <div id="dex" class="hidden">
    <div class="dex-head">
      <h2>📖 Fishopedia</h2>
      <span class="dex-count">60 species</span>
      <button id="dex-close">✕</button>
    </div>
    <div id="dex-grid"></div>
  </div>

  <!-- Gameplay HUD -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="chip" id="balance">$0.00</div>
      <div class="chip" id="round-net">+$0.00</div>
      <div class="chip badge" id="trawl-badge">🕸️ TRAWLING</div>
      <button class="chip btn" id="new-round">↺ Round</button>
    </div>

    <button id="lure-toggle" title="Lures">🎣</button>
    <div id="lure-panel" class="collapsed"></div>
    <button id="net-toggle" title="Nets">🕸️</button>
    <div id="net-panel" class="collapsed"></div>

    <div id="joystick">
      <div id="joystick-thumb"></div>
    </div>

    <div id="bite">❗</div>
    <div id="hint"></div>
    <div id="toasts"></div>
  </div>

  <!-- Big catch reveal -->
  <div id="bigcatch" class="hidden">
    <div class="bc-glow"></div>
    <div class="bc-ring"></div>
    <div class="bc-ring bc-ring2"></div>
    <div class="bc-content">
      <div class="bc-tier">PRIZE FISH</div>
      <img class="bc-fish-img" alt="">
      <div class="bc-name">Muskellunge</div>
      <div class="bc-sub">12.4 kg</div>
      <div class="bc-value">$0.00</div>
      <div class="bc-dismiss">tap to continue</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
